<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banished MegaMod Guide</title>
<style>
:root{--bg:#f6f3ec;--panel:#fffdf8;--side:#efe9dc;--ink:#2b2620;--mute:#6f665a;--line:#ddd3c1;--accent:#4f7a3a;--accent2:#8a5a2b;--hl:#fff1b8;--miss:#8c806d;--th:#e9e1d0;--tip:#eef5e6;--warn:#fbeee2;--on-accent:#fff;--focus:#2f5f1f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a17;--panel:#24211d;--side:#1f1d1a;--ink:#ebe5da;--mute:#a59c8d;--line:#3b362f;--accent:#8fbf6e;--accent2:#d8a067;--hl:#5a4a12;--miss:#8a8070;--th:#2e2a24;--tip:#243020;--warn:#33261b;--on-accent:#13200c;--focus:#b6e08f}}
:root[data-theme=dark]{--bg:#1c1a17;--panel:#24211d;--side:#1f1d1a;--ink:#ebe5da;--mute:#a59c8d;--line:#3b362f;--accent:#8fbf6e;--accent2:#d8a067;--hl:#5a4a12;--miss:#8a8070;--th:#2e2a24;--tip:#243020;--warn:#33261b;--on-accent:#13200c;--focus:#b6e08f}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
a,button,summary,[data-jump]{touch-action:manipulation}
summary{cursor:pointer}
.chip:active,.cell:active,.cards a:active,button:active,.quick a:active,nav a:active{opacity:.8}
a.missing{text-decoration:underline dotted;text-underline-offset:3px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.brand{scroll-margin-top:80px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;z-index:30;background:var(--panel);padding:8px 12px;border-radius:8px}.skip:focus{left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a.missing{color:var(--miss);cursor:default}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;white-space:nowrap;color:var(--ink);text-decoration:none}header .brand svg{width:26px;height:26px}
#q{flex:1;min-width:0;max-width:640px;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
#theme,#menu{display:inline-grid;place-items:center;background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);min-width:44px;min-height:44px;cursor:pointer;font-size:18px}
#menu{display:none}
.wrap{display:flex;min-height:calc(100vh - 53px)}
nav{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;position:sticky;top:53px;height:calc(100vh - 53px)}
nav h4{margin:14px 6px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
nav a{display:block;padding:3px 8px;border-radius:6px;color:var(--ink);font-size:14px}
nav a:hover{background:var(--line);text-decoration:none}nav a.on{background:var(--accent);color:var(--on-accent)}
#backdrop{display:none}
main{flex:1;min-width:0;padding:20px 28px 60px;max-width:1100px}
.crumb{font-size:13px;color:var(--mute);margin-bottom:6px}
h1{margin:.2em 0 .4em;font-size:28px}h2{margin-top:1.4em;border-bottom:1px solid var(--line);padding-bottom:4px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;background:var(--panel);font-size:14px}
th,td{border:1px solid var(--line);padding:5px 9px;vertical-align:top;text-align:left}

img.ic{width:36px;height:36px;padding:2px;background:#3d352a;border:1px solid #5b4f3e;border-radius:6px;vertical-align:middle;object-fit:contain}
.W.right{float:right;margin:0 0 12px 18px;max-width:420px}

.tags{margin-top:30px;clear:both}.tags span{display:inline-block;background:var(--th);border-radius:12px;padding:1px 9px;margin:2px;font-size:12px;color:var(--mute)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}

img.ic.big{width:56px;height:56px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mute)}
table.cheat td,table.cheat th{vertical-align:top}table.cheat .win{font-weight:600}.alts{margin:4px 0 0;padding-left:18px}.nodata{color:var(--mute)}
figure.diagram{margin:16px 0;max-width:420px}figure.diagram svg{width:100%;height:auto;border-radius:10px}figcaption{font-size:13px;color:var(--mute);margin-top:6px}

a>img.ic{width:26px;height:26px;padding:1px;margin-right:4px}.chip>img.ic,.quick a>img.ic{width:28px;height:28px;margin-right:0}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin:12px 0 8px}
.cs{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cs h3{margin:0 0 10px;font-size:18px}
.cs-win{font-size:17px;font-weight:700;margin-bottom:4px}
.cs-facts{color:var(--mute);font-size:14px;margin-bottom:8px}
.cs-alts{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.cs-alts ul{list-style:none;margin:4px 0 0;padding:0}.cs-alts li{margin:6px 0}
.cs-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.cs-why{margin:10px 0 0;font-size:13px;color:var(--mute);font-style:italic}
a[data-jump]{cursor:pointer}
details.prof{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 12px}

details.prof summary::before{content:'▸';color:var(--mute);width:12px}details.prof[open] summary::before{content:'▾'}
details.prof .pc{background:var(--th);border-radius:10px;padding:1px 8px;font-size:12px;color:var(--mute)}
.pg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:6px 0 10px;font-size:14px}.pg .rs-lbl{width:100%;text-transform:capitalize}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin:8px 0 12px}
.rs{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.rs-name{display:flex;align-items:center;font-weight:700;font-size:16px;color:var(--ink);margin-bottom:6px}
.rs-best,.rs-alt{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:4px 0}
.rs-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);min-width:34px}
.rs-nones{display:flex;flex-wrap:wrap;gap:6px 18px;margin:4px 0 18px;font-size:14px}.rs-none .rs-name{display:inline-flex;font-size:14px;margin:0}
.ev-h{margin:22px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
main h3.muted{margin:14px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-family:inherit}
.tierbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin:8px 0 24px}
.tierbox h2{margin-top:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{font:inherit;font-size:14px;padding:8px 12px;min-height:40px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:18px;height:18px}
.tiertable td{vertical-align:middle}.tiertable td:first-child{width:52px}
.tierbox h2 .muted{display:inline-block;font-family:inherit;font-size:13px;line-height:1.4}
@media (max-width:820px){.tierbox{padding:4px 10px 12px}.tiertable th:last-child,.tiertable td:last-child{display:none}}.tier.t-s{background:#8a5a00}.tier.t-a{background:#2f6b2a}.tier.t-b{background:#2f5a7a}.tier.t-c{background:#5f5f5f}
.tier.t-s,.tier.t-a,.tier.t-b,.tier.t-c{min-width:30px}
.badge.early{background:#2f5a7a;color:#fff}
.more{font:inherit;margin-top:10px;padding:8px 14px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--accent);cursor:pointer}
table.keys kbd{font-size:14px;padding:2px 7px;margin:0 2px;border-bottom-width:2px}
.rulebox{background:var(--warn);border:1px solid var(--accent2);border-left:5px solid var(--accent2);border-radius:10px;padding:12px 16px;margin:8px 0 16px}
.rulebox .rb-h{display:block;font-size:17px;margin-bottom:4px}.rulebox ul{margin:4px 0 8px}.rulebox p{margin:8px 0}.rulebox ol{margin:4px 0}
.badge.rule{background:#8f3f30;color:#fff;cursor:help}
.badge{display:inline-block;white-space:nowrap;vertical-align:middle;line-height:1.5;margin:2px 0 2px 4px}
.chip,.tiertable td a{vertical-align:middle}
details{margin:8px 0}summary{cursor:pointer;color:var(--accent)}
@media (max-width:1000px){.split{grid-template-columns:1fr}.panel{position:static;max-height:none;order:-1}}
@media (max-width:820px){#menu{display:inline-grid!important}nav{position:fixed;left:-290px;top:65px;height:calc(100vh - 65px);z-index:6;transition:left .2s}nav.open{left:0;box-shadow:4px 0 24px rgba(0,0,0,.3)}nav a{padding:10px 10px}#menu{display:block}#backdrop.on{display:block;position:fixed;inset:65px 0 0 0;background:rgba(0,0,0,.35);z-index:5}main{padding:16px}.W.right{float:none;max-width:none;margin:0}.W.half,.W.third{width:100%}header .brand{display:none}}
</style>

<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <button id="menu" aria-label="Open menu" aria-controls="nav" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <a class="brand" href="#/guide:home" aria-label="Banished MegaMod Guide, home"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4f7a3a" d="M12 2 5 11h3l-4 6h6v5h4v-5h6l-4-6h3z"/></svg><span>Banished Guide</span></a>
  <input id="q" type="search" placeholder="Search buildings, crops, items… ( / )" autocomplete="off" aria-label="Search the guide">
  <button id="theme" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
</header>
<div class="wrap">
  <nav id="nav" aria-label="Sections"></nav>
  <div id="backdrop"></div>
  <main id="main" tabindex="-1"><p class="muted">Loading the guide…</p></main>
</div>
<div id="live" class="skip" aria-live="polite"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.pages, ICONS = Object.fromEntries(Object.entries(D.icons.m).map(([k, i]) => [k, D.icons.u[i]]));
const $ = s => document.querySelector(s), main = $('#main'), q = $('#q');

// backlinks
const back = {};
for (const [id, p] of Object.entries(P)) for (const l of p[3] || []) (back[l] ||= []).push(id);

// search index: title, tags, plain text
const strip = h => h.replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ' ');
let IDX_ = null;
const buildIdx = () => Object.entries(P).map(([id, p]) => ({ id, t: p[0], tl: p[0].toLowerCase(), g: (p[2] || []).join(' ').toLowerCase(), x: strip(p[1]).toLowerCase(), guide: id.startsWith('guide:') }));
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function search(query) {
  const IDX = IDX_ ||= buildIdx();
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const out = [];
  for (const e of IDX) {
    let score = 0, ok = true;
    for (const w of words) {
      let s = 0;
      if (e.tl === w) s = 100; else if (e.tl.startsWith(w)) s = 60;
      else if (new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(e.tl)) s = 45;
      else if (e.tl.includes(w)) s = 30; else if (e.g.includes(w)) s = 15;
      else if (e.x.includes(w)) s = 3 + Math.min(5, e.x.split(w).length - 1);
      if (!s) { ok = false; break; }
      score += s;
    }
    if (!ok) continue;
    if (e.guide) score += 40;
    if (e.id.endsWith(':start')) score += 5;
    out.push([score, e]);
  }
  return out.sort((a, b) => b[0] - a[0] || a[1].t.length - b[1].t.length).slice(0, 80).map(r => r[1]);
}

function snippet(e, words) {
  const i = e.x.indexOf(words[0]);
  if (i < 0) return '';
  let s = esc(e.x.slice(Math.max(0, i - 60), i + 140));
  for (const w of words) s = s.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  return '…' + s + '…';
}

function crumb(id) {
  if (id.startsWith('guide:')) return '<a href="#/guide:home">Home</a> › Guides';
  const parts = id.split(':'); let acc = [], html = ['<a href="#/guide:home">Home</a>'];
  for (let i = 0; i < parts.length - 1; i++) {
    acc.push(parts[i]); const sid = acc.join(':') + ':start';
    html.push(P[sid] ? `<a href="#/${sid}">${esc(P[sid][0])}</a>` : esc(parts[i]));
  }
  return html.join(' › ');
}

let sel = 0, results = [];
function showSearch(query) {
  results = search(query); sel = 0;
  $('#live').textContent = results.length + ' results';
  if (!results.length) { main.innerHTML = `<h1>No results for “${esc(query)}”</h1><p>Check the spelling, or try one word. Popular searches:</p><div class="chips">${['forester', 'firewood', 'wool coat', 'stone', 'bean', 'storage barn', 'tool'].map(w => `<a class="chip" href="#/search/${encodeURIComponent(w)}">${w}</a>`).join('')}</div><p>Or browse the <a href="#/tool:lookup">Resource lookup</a>.</p>`; return; }
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  main.innerHTML = `<h1>Search: ${esc(query)}</h1><p class="src">${results.length >= 80 ? '80+' : results.length} results. <kbd>↑</kbd><kbd>↓</kbd> to move, <kbd>Enter</kbd> to open.</p><ul class="res">` +
    results.map((e, i) => `<li class="${i ? '' : 'sel'}"><a class="t" href="#/${e.id}">${esc(e.t)}</a>${e.guide ? ' <span class="badge">Guide</span>' : ''}<div class="p">${crumb(e.id).replace(/<[^>]+>/g, '')}</div><div class="s">${snippet(e, words)}</div></li>`).join('') + '</ul>';
}

// remember where you were on each page: links open at the top, Back/Forward return to the saved spot
const MEM = (() => { try { return JSON.parse(sessionStorage.getItem('scrollMem') || '{}'); } catch (e) { return {}; } })();
let freshNav = false, memTimer = null;
const saveMem = () => { try { sessionStorage.setItem('scrollMem', JSON.stringify(MEM)); } catch (e) {} };
document.addEventListener('click', ev => { const a = ev.target.closest('a[href^="#/"]'); if (a && !ev.defaultPrevented && decodeURIComponent(a.getAttribute('href')) !== decodeURIComponent(location.hash)) freshNav = true; }, true);
window.addEventListener('scroll', () => {
  const k = location.hash; const m = MEM[k] || (MEM[k] = {});
  m.y = window.scrollY; clearTimeout(memTimer); memTimer = setTimeout(saveMem, 250);
}, { passive: true });
// every control on the page (filters, checkboxes, selects, tabs, "show all", opened sections) is remembered per page
const mem = () => MEM[location.hash] || (MEM[location.hash] = {});
const ctlKey = el => el.id || (el.dataset.filter ? 'filter:' + el.dataset.filter : 'ctl' + [...main.querySelectorAll('input,select,textarea')].indexOf(el));
const ctlSave = ev => {

document.addEventListener('click', ev => {

function restoreView() {
  const live = MEM[location.hash];

  if (!freshNav && m) {

function render(id) {

  const b = (back[id] || []).filter(x => x !== id && !x.endsWith(':start')).sort((a, c) => P[a][0].localeCompare(P[c][0]));

  main.innerHTML = h;
  document.title = p[0] + ' · Banished Guide';
  main.querySelectorAll('img.ic').forEach(img => { const d = ICONS[img.dataset.i]; if (d) img.src = d; });

    if (a.querySelector('img')) return;

  const tg = /^buildings:([^:]+):start$/.exec(id); if (tg && typeof tierWidget === 'function') tierWidget(tg[1], p[0]);
  const ti = /^wikipages:([^:]+):start$/.exec(id); if (ti && typeof itemTierWidget === 'function') itemTierWidget(ti[1], p[0]);
  polish();

}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('/search/')) { const s = h.slice(8); if (q.value !== s) q.value = s; showSearch(s); if (document.activeElement !== q) restoreView(); return; }
  const [tid, arg] = h.slice(1).split(/\/(.*)/s);
  if (TOOLS[tid]) {
    document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + tid));
    TOOLS[tid](arg || ''); document.title = P[tid][0] + ' · Banished Guide'; main.querySelectorAll('img.ic[data-i]').forEach(img => { const d = ICONS[img.dataset.i]; if (d) img.src = d; });
    polish(); drawer(false); restoreView(); return;
  }
  render(h.startsWith('/') && h.length > 1 ? h.slice(1) : 'guide:home');
  drawer(false);
}

// nav
$('#nav').innerHTML = D.nav.map(([head, items]) => `<h4>${esc(head)}</h4>` + items.map(([id, t]) => `<a href="#/${id}">${esc(t)}</a>`).join('')).join('');

let timer;
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { if (q.value.trim()) history.replaceState(null, '', '#/search/' + encodeURIComponent(q.value)); route(); }, 150); });
q.addEventListener('keydown', ev => {
  const lis = main.querySelectorAll('.res li');
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {

    lis[sel].classList.remove('sel'); sel = Math.max(0, Math.min(lis.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1)));
    lis[sel].classList.add('sel'); lis[sel].scrollIntoView({ block: 'nearest' });
  } else if (ev.key === 'Enter' && results[sel]) { location.hash = '#/' + results[sel].id; q.blur(); }
  else if (ev.key === 'Escape') { q.value = ''; q.blur(); }
});
document.addEventListener('keydown', ev => { if (ev.key === '/' && document.activeElement !== q) { ev.preventDefault(); q.focus(); q.select(); } });
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

}
